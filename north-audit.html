<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NAVICUS 北側案件数監査</title>
  <style>
    :root{--bg:#07111f;--surface:#0c1929;--surface2:#11243a;--line:#263c54;--text:#edf4f9;--muted:#8da3b8;--cyan:#28c6d8;--green:#55d598;--amber:#f5bd58;--red:#ef7777;--violet:#a79af5}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}button,input,select{font:inherit}a{color:var(--cyan)}
    .top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;min-height:62px;padding:10px 22px;border-bottom:1px solid var(--line);background:rgba(7,17,31,.94);backdrop-filter:blur(14px)}
    .brand{display:flex;align-items:center;gap:11px;min-width:280px}.mark{width:27px;height:27px;border:6px solid var(--cyan);border-right-color:transparent;border-radius:50%}.brand strong,.brand small{display:block}.brand small{color:var(--muted);font-size:11px}.top nav{display:flex;gap:8px;margin-left:auto}.button{display:inline-flex;align-items:center;min-height:38px;padding:7px 11px;border:1px solid var(--line);border-radius:7px;background:var(--surface2);color:var(--text);text-decoration:none}.button:hover{border-color:var(--cyan)}
    .status{display:flex;align-items:center;gap:12px;padding:10px 22px;border-bottom:1px solid rgba(245,189,88,.35);background:rgba(245,189,88,.07)}.status b{color:var(--amber)}.status span{color:var(--muted);font-size:12px}
    .metrics{display:grid;grid-template-columns:repeat(7,minmax(100px,1fr));border-bottom:1px solid var(--line);background:var(--line);gap:1px}.metric{padding:15px 18px;background:var(--surface)}.metric span{display:block;color:var(--muted);font-size:11px}.metric b{font-size:23px}.metric.exact b{color:var(--green)}.metric.warn b{color:var(--amber)}.metric.bad b{color:var(--red)}
    .filters{display:grid;grid-template-columns:minmax(240px,1fr) 180px 180px auto;gap:8px;padding:13px 20px;border-bottom:1px solid var(--line)}.control{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--text)}.count{align-self:center;color:var(--muted);text-align:right;font-size:12px}
    .workspace{display:grid;grid-template-columns:minmax(390px,42%) 1fr;min-height:calc(100vh - 190px)}.list{max-height:calc(100vh - 190px);overflow:auto;border-right:1px solid var(--line)}.row{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:12px;width:100%;padding:14px 17px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--text);text-align:left;cursor:pointer;transition:.16s ease}.row:hover,.row.active{background:var(--surface2)}.row.active{box-shadow:inset 3px 0 var(--cyan)}.dot{width:9px;height:9px;margin-top:6px;border-radius:50%;background:var(--amber)}.row.exact .dot{background:var(--green)}.row.over .dot{background:var(--red)}.row.boundary .dot{background:var(--violet)}.row strong,.row small{display:block}.row small{color:var(--muted)}.numbers{text-align:right;white-space:nowrap}.numbers b{font-size:18px}.numbers small{font-size:10px}
    .detail{max-height:calc(100vh - 190px);overflow:auto;padding:25px 28px 80px}.empty{padding:70px 20px;color:var(--muted);text-align:center}.eyebrow{color:var(--cyan);font-size:11px;letter-spacing:.08em}.detail h1{margin:4px 0;font-size:28px}.detail h2{margin:28px 0 10px;font-size:15px}.sub{color:var(--muted)}
    .verdict{margin:18px 0;padding:13px 15px;border-left:3px solid var(--amber);background:rgba(245,189,88,.07)}.verdict.exact{border-color:var(--green);background:rgba(85,213,152,.07)}.verdict.over{border-color:var(--red);background:rgba(239,119,119,.07)}.verdict.boundary{border-color:var(--violet);background:rgba(167,154,245,.07)}
    .compare{display:grid;grid-template-columns:repeat(4,1fr);border-block:1px solid var(--line)}.compare div{padding:13px 14px;border-right:1px solid var(--line)}.compare div:last-child{border-right:0}.compare span,.compare b{display:block}.compare span{color:var(--muted);font-size:10px}.compare b{font-size:21px}
    .note{color:var(--muted);font-size:12px}.tree-shell{overflow:auto;border:1px solid var(--line);border-radius:9px;background:var(--surface)}.tree-head{display:flex;justify-content:space-between;gap:16px;padding:11px 14px;border-bottom:1px solid var(--line);color:var(--muted);font-size:11px}.tree-head strong{color:var(--text);font-size:12px}.route-tree{display:block;min-width:780px}.tree-edge{fill:none;stroke:#34536f;stroke-width:2}.tree-edge.detail-edge{stroke:#397c6a}.tree-node rect{fill:var(--surface2);stroke:var(--line);stroke-width:1.5}.tree-node.root rect{stroke:var(--cyan)}.tree-node.branch rect{stroke:var(--amber)}.tree-node.detail-node rect{stroke:var(--green)}.tree-node.unresolved rect{stroke:var(--violet);stroke-dasharray:5 4}.tree-node text{fill:var(--text);font-size:12px;font-weight:700}.tree-node .role{fill:var(--muted);font-size:10px;font-weight:500}.tree-node .count-label{fill:var(--green);font-size:10px;font-weight:700}.tree-more{padding:9px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}.tree-legend{display:flex;gap:15px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:10px}.tree-legend span::before{content:"";display:inline-block;width:8px;height:8px;margin-right:5px;border:1px solid var(--cyan);border-radius:2px}.tree-legend .branch-key::before{border-color:var(--amber)}.tree-legend .detail-key::before{border-color:var(--green)}.tree-legend .unknown-key::before{border-color:var(--violet);border-style:dashed}
    .evidence{display:grid;gap:0;border-top:1px solid var(--line)}.evidence a{display:block;padding:9px 3px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}.candidate{padding:11px 0;border-bottom:1px solid var(--line)}.candidate b,.candidate small{display:block}.candidate small{color:var(--muted)}.round{padding:10px 0;border-bottom:1px solid var(--line)}.round b{color:var(--cyan)}
    @media(max-width:980px){.metrics{grid-template-columns:repeat(3,1fr)}.filters{grid-template-columns:1fr 1fr}.workspace{grid-template-columns:1fr}.list,.detail{max-height:none}.list{border-right:0;border-bottom:1px solid var(--line)}.compare{grid-template-columns:1fr 1fr}.top{align-items:flex-start}.brand{min-width:0}.top nav{flex-wrap:wrap}}
    @media(max-width:620px){.top{padding:10px 14px}.brand small{display:none}.top nav{display:none}.status,.filters{padding-inline:14px}.status{align-items:flex-start;flex-direction:column;gap:2px}.metrics{grid-template-columns:1fr 1fr}.metrics .metric:last-child{grid-column:1/-1}.filters{grid-template-columns:1fr}.count{text-align:left}.workspace{min-height:0}.detail{padding:22px 16px 60px}.compare{grid-template-columns:1fr 1fr}.compare b{font-size:18px}.button{padding-inline:9px}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <header class="top"><div class="brand"><span class="mark"></span><div><strong>NAVICUS 北側案件数監査</strong><small>北海道〜愛知・公式経路との突合</small></div></div><nav><a class="button" href="index.html">自治体台帳</a><a class="button" href="status.html">ループ状況</a></nav></header>
  <section class="status"><b>REVIEW ONLY / NO-GO</b><span>公式一覧の行数には結果・質問回答・更新記事が混在します。ここでの差分は確認候補であり、そのまま正解案件数ではありません。</span></section>
  <section class="metrics" id="metrics"></section>
  <section class="filters"><input class="control" id="search" placeholder="自治体名・都道府県・IDを検索"><select class="control" id="pref"><option value="all">全都道府県</option></select><select class="control" id="verdict"><option value="all">全判定</option></select><span class="count" id="count"></span></section>
  <main class="workspace"><section class="list" id="list"></section><article class="detail" id="detail"><div class="empty">自治体を選択すると監査結果を表示します</div></article></main>
  <script>
    const labels={EXACT_CONFIRMED:"一致確認",OFFICIAL_LIST_ENUMERATED:"公式一覧全件列挙",OFFICIAL_BRANCHES_ENUMERATED:"公式枝全件列挙",DETAIL_REVIEW_REQUIRED:"詳細確認残り",UNDERCOUNT_SUSPECTED:"過少計上疑い",OVERCOUNT_OR_DUPLICATE_SUSPECTED:"過剰・重複疑い",ROOT_INCOMPLETE:"起点不完全",PUBLIC_BOUNDARY_UNMEASURABLE:"公開境界を測定不能"};
    const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const url=u=>/^https?:\/\//.test(u||"")?u:"#";
    const cls=v=>["EXACT_CONFIRMED","OFFICIAL_LIST_ENUMERATED","OFFICIAL_BRANCHES_ENUMERATED"].includes(v)?"exact":v==="OVERCOUNT_OR_DUPLICATE_SUSPECTED"?"over":v==="PUBLIC_BOUNDARY_UNMEASURABLE"?"boundary":"warn";
    let data,selected=null;
    async function init(){data=await fetch("north-audit-data.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()});renderMetrics();setup();const requested=new URLSearchParams(location.search).get("issuer");selected=data.items.some(x=>x.issuer_id===requested)?requested:data.items[0]?.issuer_id;render()}
    function renderMetrics(){const c=data.summary.conclusion_counts||{};const cells=[["対象発注者",data.summary.issuer_count,""],["Pages表示",data.summary.pages_count,""],["公式一覧行",data.summary.official_row_observation_count,"warn"],["全件列挙済み",(c.EXACT_CONFIRMED||0)+(c.OFFICIAL_LIST_ENUMERATED||0)+(c.OFFICIAL_BRANCHES_ENUMERATED||0),"exact"],["過少疑い",c.UNDERCOUNT_SUSPECTED||0,"warn"],["起点・境界未確定",(c.ROOT_INCOMPLETE||0)+(c.PUBLIC_BOUNDARY_UNMEASURABLE||0)+(c.DETAIL_REVIEW_REQUIRED||0),"warn"],["過剰・重複",c.OVERCOUNT_OR_DUPLICATE_SUSPECTED||0,"bad"]];metrics.innerHTML=cells.map(x=>`<div class="metric ${x[2]}"><span>${x[0]}</span><b>${x[1]}</b></div>`).join("")}
    function setup(){[...new Set(data.items.map(x=>x.prefecture))].forEach(x=>pref.insertAdjacentHTML("beforeend",`<option>${esc(x)}</option>`));Object.entries(labels).forEach(([k,v])=>verdict.insertAdjacentHTML("beforeend",`<option value="${k}">${v}</option>`));[search,pref,verdict].forEach(x=>x.addEventListener("input",render))}
    function filtered(){const q=search.value.trim().toLowerCase();return data.items.filter(x=>(pref.value==="all"||x.prefecture===pref.value)&&(verdict.value==="all"||x.conclusion===verdict.value)&&(!q||`${x.display_name} ${x.prefecture} ${x.issuer_id}`.toLowerCase().includes(q)))}
    function render(){const xs=filtered();if(!xs.some(x=>x.issuer_id===selected))selected=xs[0]?.issuer_id;count.textContent=`${xs.length} / ${data.items.length}発注者`;list.innerHTML=xs.map(x=>`<button class="row ${cls(x.conclusion)} ${x.issuer_id===selected?"active":""}" data-id="${esc(x.issuer_id)}"><span class="dot"></span><span><strong>${esc(x.display_name)}</strong><small>${esc(x.prefecture)} · ${esc(labels[x.conclusion])}</small></span><span class="numbers"><b>${x.pages_count} → ${x.official_rows}</b><small>表示 → 公式一覧行</small></span></button>`).join("")||'<div class="empty">条件に一致しません</div>';document.querySelectorAll(".row").forEach(b=>b.onclick=()=>{selected=b.dataset.id;const next=new URL(location.href);next.searchParams.set("issuer",selected);history.replaceState(null,"",next);render();if(innerWidth<981)detail.scrollIntoView({behavior:"smooth"})});renderDetail()}
    function short(value,n=25){const s=String(value||"");return s.length>n?s.slice(0,n-1)+"…":s}
    function graph(x){const roleLabels={whole_site_proposal_category:"全庁プロポーザル一覧",department_recruitment_branch:"局・事務局別募集",department_procurement_hub:"部局調達ハブ",department_proposal_list:"部局プロポーザル一覧",proposal_or_procurement_list:"公募・調達一覧",year_archive:"年度アーカイブ",department_root:"部局別起点",checked_official_branch:"確認済み公式枝"};const root=x.route?.root,all=x.route?.branches||[],branches=all,nodeW=200,nodeH=74,left=18,mid=286,right=554,rowGap=98,height=Math.max(154,branches.length*rowGap+34),rootY=Math.max(22,(height-nodeH)/2),rootX=left,branchX=mid,detailX=right;const rootMid=rootY+nodeH/2;let edges="",nodes="";const node=(kind,xp,yp,title,role,href,count="")=>{const body=`<g class="tree-node ${kind}" transform="translate(${xp} ${yp})"><rect width="${nodeW}" height="${nodeH}" rx="9"/><text x="13" y="25">${esc(short(title))}</text><text class="role" x="13" y="47">${esc(short(role,30))}</text>${count!==""?`<text class="count-label" x="13" y="64">${esc(count)}</text>`:""}</g>`;return href?`<a href="${esc(url(href))}" target="_blank" rel="noopener"><title>${esc(href)}</title>${body}</a>`:body};nodes+=node("root",rootX,rootY,x.display_name,"クロール起点",root?.url||x.root_url);branches.forEach((b,i)=>{const by=18+i*rowGap,bm=by+nodeH/2,details=b.details||[],detailHref=details[0]?.url||"",detailTitle=details[0]?.label||(b.case_count?`${b.case_count}行から詳細へ`:b.scanned?"該当0件（確認済み）":"詳細経路未記録"),detailRole=details.length?`案件詳細 ${details.length}件を記録`:b.case_count?"案件候補・更新行を含む":b.scanned?"ページ全行を分類済み":"枝から詳細への接続証跡不足",detailKind=(details.length||b.case_count||b.scanned)?"detail-node":"unresolved",branchTitle=roleLabels[b.role]||b.label||b.role||"公式一覧";edges+=`<path class="tree-edge" d="M ${rootX+nodeW} ${rootMid} C ${rootX+nodeW+43} ${rootMid}, ${branchX-43} ${bm}, ${branchX} ${bm}"/><path class="tree-edge detail-edge" d="M ${branchX+nodeW} ${bm} C ${branchX+nodeW+43} ${bm}, ${detailX-43} ${bm}, ${detailX} ${bm}"/>`;nodes+=node("branch",branchX,by,branchTitle,b.url?short(b.url,27):b.role||"公式一覧",b.url,b.case_count?`観測 ${b.case_count}行`:b.scanned?"候補 0件":"");nodes+=node(detailKind,detailX,by,detailTitle,detailRole,detailHref,details.length>1?`ほか ${details.length-1}件`:"")});return `<div class="tree-shell"><div class="tree-head"><strong>クロール起点から案件詳細まで</strong><span>起点 1 · 枝 ${all.length} · 詳細到達 ${x.details_reached}</span></div><svg class="route-tree" width="780" height="${height}" viewBox="0 0 780 ${height}" role="img" aria-label="${esc(x.display_name)}のクロール経路ツリー">${edges}${nodes}</svg><div class="tree-legend"><span>クロール起点</span><span class="branch-key">年度・部局・公式一覧</span><span class="detail-key">案件詳細への到達</span><span class="unknown-key">接続証跡不足</span></div></div>`}
    function renderDetail(){const x=data.items.find(i=>i.issuer_id===selected);if(!x){detail.innerHTML='<div class="empty">表示対象がありません</div>';return}const rounds=(x.discovery_rounds||[]).map(r=>`<div class="round"><b>Round ${esc(r.round)}</b><div>${esc(r.finding||r.result||"")}</div></div>`).join("");const verified=["EXACT_CONFIRMED","OFFICIAL_LIST_ENUMERATED","OFFICIAL_BRANCHES_ENUMERATED"].includes(x.conclusion);detail.innerHTML=`<div class="eyebrow">${esc(x.prefecture)} / ${esc(x.issuer_id)}</div><h1>${esc(x.display_name)}</h1><p class="sub">観測 ${esc(x.observed_at||"不明")} · 信頼度 ${esc(x.confidence)}</p><div class="verdict ${cls(x.conclusion)}"><b>${esc(labels[x.conclusion]||x.conclusion)}</b><div>${verified?"既知案件を母集団にせず、公式一覧の公開行を全件列挙しました。":"差分または公開境界の問題があります。人力確認後に確定してください。"}</div></div><section class="compare"><div><span>Pages表示</span><b>${x.pages_count}</b></div><div><span>台帳論理キー</span><b>${x.canonical_count}</b></div><div><span>公式一覧行</span><b>${x.official_rows}</b></div><div><span>差分</span><b>${x.delta>0?"+":""}${x.delta}</b></div></section><p class="note">公式一覧行には募集・結果・質問回答・更新が混在する場合があります。差分をそのまま追加件数として扱わないでください。</p><h2>クロール起点と枝葉</h2>${graph(x)}<h2>未収載候補 ${x.missing_candidates.length}</h2>${x.missing_candidates.map(c=>`<div class="candidate"><b>${esc(c.title)}</b>${c.url?`<a href="${esc(url(c.url))}" target="_blank" rel="noopener">公式候補を開く ↗</a>`:""}<small>${esc(c.status)}</small></div>`).join("")||'<p class="note">具体的候補は未記録です。</p>'}<h2>確認した公式URL ${x.checked_urls.length}</h2><div class="evidence">${x.checked_urls.map(u=>`<a href="${esc(url(u.url))}" target="_blank" rel="noopener">${esc(u.label||u.url)} ↗</a>`).join("")||'<p class="note">URL記録なし</p>'}</div><h2>探索ラウンド</h2>${rounds||'<p class="note">ラウンド記録なし</p>'}`}
    init().catch(e=>{document.body.innerHTML=`<div class="empty">監査データを読み込めませんでした: ${esc(e.message)}</div>`});
  </script>
</body>
</html>
